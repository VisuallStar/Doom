name: Build Android APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build universal APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/PrivateAgent-universal.apk

      - name: Build split APKs (per ABI)
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/PrivateAgent-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/PrivateAgent-armv7.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/PrivateAgent-x86_64.apk

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          echo "=== Built APKs ==="
          ls -lh *.apk
          cat SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAgent-APKs-${{ github.sha }}
          path: dist/*
          retention-days: 30
